<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>permissions-center demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1013;
          --card: #16191e;
          --fg: #f3f4f6;
          --muted: #9ca3af;
          --border: #262b33;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 40px 20px 64px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 980px; margin: 0 auto; }
      h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
      .lede { margin: 0 0 28px; color: var(--muted); max-width: 62ch; }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .card h2 { margin: 0; font-size: 15px; font-weight: 650; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
      .state {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        color: var(--muted);
      }
      .dot { width: 9px; height: 9px; border-radius: 999px; background: #9ca3af; }
      .dot[data-state="granted"] { background: #16a34a; }
      .dot[data-state="denied"] { background: #dc2626; }
      .dot[data-state="prompt"] { background: #d97706; }
      .dot[data-state="unsupported"] { background: #9ca3af; }
      .row { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
      button {
        flex: 1;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        border-radius: 9px;
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .outcome { font-size: 12.5px; color: var(--muted); min-height: 1.2em; }
      pre {
        margin: 28px 0 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        overflow-x: auto;
        font-size: 12.5px;
      }
      .warn {
        margin: 22px 0 0;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>permissions-center</h1>
      <p class="lede">
        Live permission state via <code>observe()</code>, real prompts via
        <code>request()</code>, and browser-specific recovery instructions via
        <code>showHelp()</code>. Serve this over <code>http://localhost</code> or HTTPS —
        most of these features are unavailable on <code>file://</code>.
      </p>

      <div class="grid" id="grid"></div>

      <p class="warn" id="support"></p>

      <h2 style="margin: 30px 0 0; font-size: 15px">detectBrowser()</h2>
      <pre id="detect"></pre>
    </main>

    <script src="../dist/index.global.js"></script>
    <script>
      const PC = window.PermissionsCenter;
      const NAMES = [
        'camera',
        'microphone',
        'geolocation',
        'notifications',
        'clipboard-read',
        'persistent-storage',
      ];

      const grid = document.getElementById('grid');
      const disposers = [];

      for (const name of NAMES) {
        const card = document.createElement('div');
        card.className = 'card';

        const title = document.createElement('h2');
        title.textContent = name;
        card.appendChild(title);

        const state = document.createElement('span');
        state.className = 'state';
        const dot = document.createElement('span');
        dot.className = 'dot';
        const text = document.createElement('span');
        text.textContent = 'reading…';
        state.append(dot, text);
        card.appendChild(state);

        const outcome = document.createElement('div');
        outcome.className = 'outcome';
        card.appendChild(outcome);

        const row = document.createElement('div');
        row.className = 'row';

        const ask = document.createElement('button');
        ask.className = 'primary';
        ask.type = 'button';
        ask.textContent = 'Request';
        ask.addEventListener('click', async () => {
          outcome.textContent = 'asking…';
          const result = await PC.request(name);
          outcome.textContent = 'request() → ' + result;
        });

        const help = document.createElement('button');
        help.type = 'button';
        help.textContent = 'How to unblock';
        help.addEventListener('click', () => PC.showHelp(name));

        row.append(ask, help);
        card.appendChild(row);
        grid.appendChild(card);

        disposers.push(
          PC.observe(name, (info) => {
            dot.dataset.state = info.state;
            text.textContent = info.state;
            ask.disabled = false;
          }),
        );
      }

      document.getElementById('support').textContent = PC.isSupported()
        ? 'navigator.permissions.query() is available here. States above update live — change one in browser settings and watch it move without a reload.'
        : 'navigator.permissions.query() is missing in this browser, so every card reads "unsupported". request() and showHelp() still work.';

      document.getElementById('detect').textContent = JSON.stringify(
        PC.detectBrowser(),
        null,
        2,
      );

      window.addEventListener('beforeunload', () => {
        for (const stop of disposers) stop();
        PC.closeHelp();
      });
    </script>
  </body>
</html>
